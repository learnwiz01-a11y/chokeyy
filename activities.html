<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Activities</title>
  <link rel="stylesheet" href="css/activities.css">

<body>

    <div class="activity-item">
      <img src="activities/movies.jpeg" alt="Movies">
      <label><input type="checkbox" name="activities" value="Movies"> Movies</label>
    </div>

    <div class="activity-item">
      <img src="activities/bowling.jpeg" alt="Bowling">
      <label><input type="checkbox" name="activities" value="Bowling"> Bowling</label>
    </div>

    <div class="activity-item">
      <img src="activities/picnic.jpeg" alt="Picnic">
      <label><input type="checkbox" name="activities" value="Picnic"> Picnic</label>
    </div>

    <div class="activity-item">
      <img src="activities/iceskating.jpeg" alt="Ice Skating">

  <button class="button" onclick="location.href='lastpage.html'">Last page ...</button>
