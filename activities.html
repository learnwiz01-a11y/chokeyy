<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activities</title>
  <link rel="stylesheet" href="activities.css"> <!-- Change this if CSS is in root -->

<body>

  <div id="activityquestion"><b>What are we doing after?</b></div>

  <div class="activities-selection">

    <div class="activity-item">
      <img src="netflix-and-chill.jpeg" alt="Netflix and chill">
      <label>
        <input type="checkbox" name="activities" value="netflix and chill">
        Netflix and chill
      </label>
    </div>

    <div class="activity-item">
      <img src="arcade.jpeg" alt="Arcade">
      <label>
        <input type="checkbox" name="activities" value="arcade">
        Arcade
      </label>
    </div>

    <div class="activity-item">
      <img src="movies.jpeg" alt="Movies">
      <label>
        <input type="checkbox" name="activities" value="movies">
        Movies
      </label>
    </div>

    <div class="activity-item">
      <img src="bowling.jpeg" alt="Bowling">
      <label>
        <input type="checkbox" name="activities" value="bowling">
        Bowling
      </label>
    </div>

    <div class="activity-item">
      <img src="picnic.jpeg" alt="Picnic">
      <label>
        <input type="checkbox" name="activities" value="picnic">
        Picnic
      </label>
    </div>

    <div class="activity-item">
      <img src="iceskating.jpeg" alt="Ice Skating">
      <label>
        <input type="checkbox" name="activities" value="ice skating">
        Ice skating
      </label>
    </div>

  </div>

  <button class="button" onclick="location.href='lastpage.html'">
    Last page ...
  </button>
