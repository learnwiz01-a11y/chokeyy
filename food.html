<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat?</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="food/me.jpeg" alt="me" />
        <label>
          <input type="checkbox" name="food" value="me" /> me hehe
        </label>
      </div>

      <div class="food-item">
        <img src="food/brunch.jpeg" alt="brunch" />
        <label>
          <input type="checkbox" name="food" value="brunch" /> brunch at paul
        </label>
      </div>

      <div class="food-item">
        <img src="food/italian.jpeg" alt="italian" />
        <label>
          <input type="checkbox" name="food" value="italian" /> italian
        </label>
      </div>

      <div class="food-item">
        <img src="food/indian.jpeg" alt="indian" />
        <label>
          <input type="checkbox" name="food" value="indian" /> indian
        </label>
      </div>

      <div class="food-item">
        <img src="food/mcdonalds.jpeg" alt="mcdonalds" />
        <label>
          <input type="checkbox" name="food" value="mcdonalds" /> McDonalds :)
        </label>
      </div>

      <div class="food-item">
        <img src="food/sushi.jpeg" alt="sushi" />
        <label>
          <input type="checkbox" name="food" value="sushi" /> sushi at Kofuku
        </label>
      </div>

      <div class="food-item">
        <img src="food/ramen.jpeg" alt="ramen" />
        <label>
          <input type="checkbox" name="food" value="ramen" /> ramen at Lea Izakaya
        </label>
      </div>
    </div>

    <button class="button" onclick="location.href='dessert.html'">
      Continue Hihihhh... 
    </button>
  </body>
</html>
